name: tests

# Python-тесты (guard, Agent API, ядро agent_pipeline).
# ONNX-модели не нужны: remove_bg мокается в тестах.

on:
  workflow_dispatch:
  pull_request:
    paths: ["server.py", "agent_pipeline.py", "agent_api.py", "tests/**",
            "requirements*.txt", "pytest.ini", ".github/workflows/tests.yml"]
  push:
    branches: [main]
    paths: ["server.py", "agent_pipeline.py", "agent_api.py", "tests/**",
            "requirements*.txt", "pytest.ini", ".github/workflows/tests.yml"]

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
