name: Build desktop releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Check Python modules
        run: python -m py_compile app.py server.py updater.py platform_utils.py context_menu_helper.py

      - name: Build portable application
        run: python -m PyInstaller build.spec --noconfirm --clean

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: |
          $ver = (Select-String -Path version.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" installer.iss

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokenatra-windows
          path: dist/installer/Tokenatra_v*_windows_x86_64_setup.exe
          if-no-files-found: error

  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Linux desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libgtk-3-0 libwebkit2gtk-4.0-37 \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.0 \
            libgirepository1.0-dev libcairo2-dev pkg-config python3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # pygobject 3.48 — последняя ветка под girepository-1.0 (ubuntu-22.04)
          python -m pip install -r requirements.txt pyinstaller "pygobject==3.48.2"

      - name: Check Python modules
        run: python -m py_compile app.py server.py updater.py platform_utils.py context_menu_helper.py

      - name: Build portable application and AppImage
        run: bash build-unix.sh

      - name: Create portable archive
        run: |
          VER="$(python3 -c 'from version import __version__; print(__version__)')"
          tar -C dist -czf "dist/Tokenatra_v${VER}_linux_x86_64.tar.gz" Tokenatra

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokenatra-linux-x86_64
          path: |
            dist/Tokenatra_v*_linux_x86_64.AppImage
            dist/Tokenatra_v*_linux_x86_64.tar.gz
          if-no-files-found: error

  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Check Python modules
        run: python -m py_compile app.py server.py updater.py platform_utils.py context_menu_helper.py

      - name: Build app bundle and DMG
        run: bash build-unix.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokenatra-macos
          path: dist/Tokenatra_*.dmg
          if-no-files-found: error

  macos-intel:
    name: macOS Intel
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Check Python modules
        run: python -m py_compile app.py server.py updater.py platform_utils.py context_menu_helper.py

      - name: Build app bundle and DMG
        run: bash build-unix.sh

      - name: Upload macOS Intel artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokenatra-macos-intel
          path: dist/Tokenatra_*.dmg
          if-no-files-found: error

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos, macos-intel]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
