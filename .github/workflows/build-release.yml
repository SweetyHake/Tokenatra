name: Build desktop releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cross-platform.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller onnxruntime-directml numpy Pillow flask pywebview psutil imageio-ffmpeg

      - name: Check Python modules
        run: python -m py_compile app.py server.py updater.py platform_utils.py context_menu_helper.py

      - name: Build portable application
        run: python -m PyInstaller build.spec --noconfirm --clean

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokenatra-windows
          path: dist/installer/Tokenatra_Setup_v*.exe
          if-no-files-found: error

  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cross-platform.txt

      - name: Install Linux desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libgtk-3-0 libwebkit2gtk-4.0-37

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-cross-platform.txt pyinstaller

      - name: Check Python modules
        run: python -m py_compile app.py server.py updater.py platform_utils.py context_menu_helper.py

      - name: Build and archive application
        run: |
          python -m PyInstaller build.spec --noconfirm --clean
          tar -C dist -czf "dist/Tokenatra-linux-x86_64.tar.gz" Tokenatra

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokenatra-linux-x86_64
          path: dist/Tokenatra-linux-x86_64.tar.gz
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cross-platform.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-cross-platform.txt pyinstaller

      - name: Check Python modules
        run: python -m py_compile app.py server.py updater.py platform_utils.py context_menu_helper.py

      - name: Build and archive application
        run: |
          python -m PyInstaller build.spec --noconfirm --clean
          ARCH="$(uname -m)"
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/Tokenatra.app" "dist/Tokenatra-macos-${ARCH}.zip"
          printf '%s' "$ARCH" > macos-arch.txt

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokenatra-macos
          path: dist/Tokenatra-macos-*.zip
          if-no-files-found: error

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
