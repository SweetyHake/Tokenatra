[package]
name = "tokenatra"
version = "26.5.2"
edition = "2024"
description = "Tokenatra: token editor & background remover"
default-run = "tokenatra"

[[bin]]
name = "tokenatra"
path = "src/main.rs"

[[bin]]
name = "TokenatraMCP"
path = "src/bin/tokenatra_mcp.rs"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.23"
if-addrs = "0.15"
image = { version = "0.25", features = ["avif"] }
imageproc = "0.27"
open = "5"
percent-encoding = "2"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs"] }
url = "2.5"
webp = "0.3"
which = "8"
wry = "0.57"
tray-icon = "0.21"
muda = "0.17"

# ONNX Runtime (pyke io). Static prebuilt binaries exist per EP set:
# Windows -> DirectML (covers NVIDIA, AMD and Intel out of the box via DX12);
# macOS -> CoreML; Linux -> CPU by default.
# Optional GPU EPs via Cargo features: --features cuda | rocm | coreml.
ort = { version = "2.0.0-rc.15", features = ["half"] }
crossbeam-channel = "0.5.17"
half = "2.7.1"

[target.'cfg(windows)'.dependencies]
# DirectML runs on NVIDIA, AMD and Intel GPUs without requiring external CUDA/cuDNN SDKs
ort = { version = "2.0.0-rc.15", features = ["directml"] }
# registry verbs / context menu (win.rs); module itself is cfg(windows)-gated
winreg = "0.56"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Threading",
] }

[features]
# Optional GPU EPs where the target dep does not already include them.
cuda = ["ort/cuda"]
rocm = ["ort/rocm"]
coreml = ["ort/coreml"]

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "2.0.0-rc.15", features = ["coreml"] }

[build-dependencies]
# Embeds icon.ico into the exe: Explorer, shortcuts (installer.iss points
# at the exe), "Apps & Features" (UninstallDisplayIcon) and registry verbs
# (win.rs sets Icon = exe path) all take the icon from the exe resource.
# Plain section (not cfg(windows)): build.rs must compile on linux/mac
# runners too; embedding itself is gated there by CARGO_CFG_TARGET_OS.
winresource = "0.1"
